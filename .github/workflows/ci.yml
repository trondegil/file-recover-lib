name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The whole suite on every platform we ship for. Cross-compiling a binary
  # proves it links, not that it works: positioned reads, path handling, and
  # filename sanitising all differ by OS.
  build-test:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all --no-fail-fast

      # The dhat-heap feature gates code that --all-targets does not enable, so
      # check it builds (and clippy-clean) to keep the profiling harness from
      # rotting.
      - name: Clippy with dhat-heap feature
        run: cargo clippy --features dhat-heap --example heap_profile -- -D warnings

  # Releases are generated from commit subjects, so a subject release-please
  # cannot parse is a change that never reaches the changelog. Checked on
  # pull requests, where the set of commits is well defined.
  commit-messages:
    name: commit messages parse
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check Conventional Commit subjects
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/check-commit-messages.sh "$BASE" "$HEAD"

  # Dependency policy: fail on any advisory against a dependency, and keep
  # the release binary's dependency count small (the audit reports it).
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit --deny warnings
      - name: Report the release dependency tree
        run: cargo tree --edges normal --prefix depth | sed -n '1,40p'

  # Real-image corpus (corpus/README.md): undelete and scan every image built by
  # a real OS and fail if recall on any of them drops below its baseline. The
  # images come from a release tarball pinned in corpus/corpus.lock and are
  # cached on that file's hash. Until a tarball is published the test skips.
  corpus:
    name: real-image corpus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Restore corpus images
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: corpus/images
          key: corpus-${{ hashFiles('corpus/corpus.lock') }}

      - name: Run corpus test
        shell: bash
        run: |
          if grep -q '"url": "https://' corpus/corpus.lock; then
            export UNEARTH_CORPUS_REQUIRED=1
          else
            echo "::warning::corpus tarball not published yet (corpus/publish.sh); the corpus test will skip"
          fi
          cargo test --release --test corpus_test -- --ignored --nocapture

  # Line coverage, informational only: no threshold, the job never fails the
  # build. Two reports are uploaded: the default suite alone, and the default
  # suite plus the real-image corpus test. Tests that spawn the built binary
  # count too: the binary is instrumented like everything else and inherits
  # LLVM_PROFILE_FILE from the test process.
  coverage:
    name: coverage (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install llvm-tools and cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - name: Coverage of the default suite
        run: |
          cargo llvm-cov --all-targets --lcov --output-path coverage-default.lcov
          cargo llvm-cov report --html --output-dir coverage-default-html
          cargo llvm-cov report | tail -n 40

      - name: Restore corpus images
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: corpus/images
          key: corpus-${{ hashFiles('corpus/corpus.lock') }}

      - name: Coverage of the default suite plus the corpus
        shell: bash
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --no-report --all-targets
          if grep -q '"url": "https://' corpus/corpus.lock; then
            cargo llvm-cov --no-report --test corpus_test -- --ignored
          else
            echo "::warning::corpus tarball not published yet; the corpus run is skipped in this report"
          fi
          cargo llvm-cov report --lcov --output-path coverage-with-corpus.lcov
          cargo llvm-cov report --html --output-dir coverage-with-corpus-html
          cargo llvm-cov report | tail -n 40

      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            coverage-default.lcov
            coverage-default-html
            coverage-with-corpus.lcov
            coverage-with-corpus-html

  # The declared minimum supported Rust version (Cargo.toml `rust-version`)
  # should still build and pass the suite. Informational for now: the
  # committed Cargo.lock resolves clap_lex 1.1.0, which needs edition 2024
  # (Rust 1.85), so 1.75 cannot build the locked tree until the owner either
  # raises `rust-version` or pins the dependency. The job shows the gap
  # without blocking merges.
  msrv:
    name: build + test on MSRV (1.75, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.75"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test --all --no-fail-fast
